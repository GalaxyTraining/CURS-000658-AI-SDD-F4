spring.application.name=catalogo-productos
# Catálogo de Productos - ver specs/architecture/tech-stack.md y ADR-0005

# H2 en memoria (ADR-0005): los datos se pierden al reiniciar
spring.datasource.url=jdbc:h2:mem:catalogo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# El esquema se genera desde las entidades JPA del adaptador de persistencia
spring.jpa.hibernate.ddl-auto=create-drop

# Las transacciones terminan en la capa de aplicación, no en la vista (arquitectura hexagonal)
spring.jpa.open-in-view=false

# Swagger UI muestra el contrato autoritativo (ADR-0008), no uno generado desde el código
springdoc.swagger-ui.url=/catalog-openapi.yaml

# Consola H2 solo para desarrollo (ADR-0005)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
